name: Daily Model Training

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight
  workflow_dispatch:

jobs:
  train-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run Model Pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python - <<'PY'
          import os
          uri = os.getenv('MLFLOW_TRACKING_URI', '')
          if not uri:
              raise SystemExit('ERROR: MLFLOW_TRACKING_URI is missing. Add the GitHub repository secret MLFLOW_TRACKING_URI.')
          if uri.startswith(('file:', './', '/')):
              raise SystemExit('ERROR: MLFLOW_TRACKING_URI must point to a remote MLflow/DagsHub server, not a filesystem path.')
            if 'dagshub.com/vinodsahuwani/aqi-predictor.mlflow' not in uri:
              raise SystemExit('ERROR: MLFLOW_TRACKING_URI must be https://dagshub.com/vinodsahuwani/aqi-predictor.mlflow')
            if not os.getenv('MLFLOW_TRACKING_USERNAME') or not os.getenv('MLFLOW_TRACKING_PASSWORD'):
              raise SystemExit('ERROR: MLFLOW_TRACKING_USERNAME and MLFLOW_TRACKING_PASSWORD are required.')
          print('MLFLOW_TRACKING_URI is configured for a remote tracking backend.')
          PY
          python -m scripts.pipeline_runner daily

