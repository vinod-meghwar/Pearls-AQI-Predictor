name: Hourly Data Pipeline

on:
  schedule:
    - cron: '5 * * * *'  # Runs at the start of every hour
  workflow_dispatch:      # Allows to run it manually for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run Data Pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python - <<'PY'
          import os
          uri = os.getenv('MONGO_URI')
          if not uri:
              raise SystemExit('ERROR: MONGO_URI is missing. Add the GitHub repository secret MONGO_URI.')
          if not uri.startswith(('mongodb://', 'mongodb+srv://')):
              raise SystemExit("ERROR: MONGO_URI is malformed. It must start with 'mongodb://' or 'mongodb+srv://'.")
          print('MONGO_URI is configured and has a valid MongoDB scheme.')
          PY
          python -m scripts.pipeline_runner hourly

